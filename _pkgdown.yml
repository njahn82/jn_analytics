template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#1a3771"
    navbar-light-active-color: "#fff"
    navbar-light-hover-color: "#bfbfbf"
    navbar-light-color: "#fff"
    font_scale: 1.2
    base_font: {google: "Roboto"}
    code_font: {google: "Roboto Mono"}

home:
  sidebar:
    structure: [links, license, citation, authors, dev, custom]
    components:
      custom:
        title: Funding
        text: Funded by the [Deutsche Forschungsgemeinschaft](https://gepris.dfg.de/gepris/projekt/416115939?context=projekt&task=showDetail&id=416115939&).

navbar:
  bg: primary
  type: light
  structure:
    left: [intro, reference, articles, news]
    right: [search]

footer:
  structure:
    left: legal
  components:
    legal: Developed at the [State and University Library Göttingen (SUB Göttingen)](https://www.sub.uni-goettingen.de/sub-aktuell/) | [Impressum](https://www.sub.uni-goettingen.de/impressum/)

articles:
  - title: Data model
    navbar: ~
    contents:
      - data-model

reference:
  - title: Reference tables
    desc: >
      Journals, agreements and dashboard portfolios, shipped with the package.
      Every other table joins to them by `issn_l` or `agreement_id`.
    contents:
      - journals
      - journal_issns
      - agreements
      - agreement_journals
      - agreement_institutions
      - portfolios

  - title: Analysis
    desc: >
      The same functions run on the Parquet export and on BigQuery.
    contents:
      - jn_oa
      - jn_source

  - title: Schema
    desc: >
      One schema for column names, types and descriptions, used for
      validation, the BigQuery column descriptions and the Parquet metadata.
    contents:
      - jn_schema
      - jn_tables
      - jn_validate

  - title: Building the data
    desc: >
      Reference tables from the raw JCT and ESAC files, BigQuery tables from
      the SQL templates in `inst/sql`, and the Parquet export. Usually run
      through the targets pipeline in `_targets.R`.
    contents:
      - jn_update_reference
      - jn_save_reference
      - jn_fetch_openalex_sources
      - jn_upload_reference
      - jn_build
      - jn_build_table
      - jn_publish
      - jn_publish_tables
      - jn_release

  - title: BigQuery
    contents:
      - jn_bq_config
      - jn_bq_auth
      - jn_bq_fields
      - jn_sql
      - jn_snapshots

  - title: Normalisation
    contents:
      - normalize_issn
      - normalize_publisher
      - normalize_ror

  - title: Package
    contents:
      - jnanalytics-package
