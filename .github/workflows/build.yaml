# Data build, started by hand (Actions tab -> build -> Run workflow, or
# `gh workflow run build.yaml`); releases are roughly quarterly. Before a
# build, put the current JCT files (jct_jn_all.csv, gzipped to
# jct_jn_all.csv.gz, plus jct_inst_all.csv and esac_df.csv from the jct_data
# scraper) into data-raw/ and push. Runs the
# targets pipeline (_targets.R), which only rebuilds what changed (raw files,
# SQL, Crossref/OpenAlex snapshots, year).
#
# Needs the repository secret GCP_SA_KEY: a service-account key (JSON) with
# - BigQuery Job User on the billing project (subugoe-collaborative)
# - BigQuery Data Viewer on cr_instant and openalex_walden
# - BigQuery Data Editor on jn_analytics
# The service account jn-analytics-build@subugoe-collaborative has these.
#
# It also needs the repository secret HF_TOKEN: a fine-grained Hugging Face
# token with write access to the dataset najkoja/jn_analytics only. The
# pipeline uploads the Parquet export there, tagged with the build date.
#
# Run with "check only" to test the logins and permissions without a build:
# it reads the snapshot dates, dry-runs the articles query, writes and
# deletes a one-row test table in jn_analytics, and checks the Hugging Face
# token and dataset. Nothing is billed.
name: build

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check only: test login and permissions, no build"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::targets
            any::bigrquery
            any::arrow
            any::jsonlite

      - name: Install the Hugging Face CLI
        run: pipx install huggingface_hub

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Check login and permissions
        if: inputs.check_only
        run: |
          pkgload::load_all(quiet = TRUE)
          jn_bq_auth()
          cat("Snapshots:\n"); print(jn_snapshots())
          jn_build_table("articles", dry_run = TRUE)
          config <- jn_bq_config()
          tbl <- bigrquery::bq_table(config$project, config$dataset, "_auth_check")
          bigrquery::bq_table_upload(tbl, data.frame(ok = TRUE), write_disposition = "WRITE_TRUNCATE")
          bigrquery::bq_table_delete(tbl)
          cat("Wrote and deleted a test table in", config$dataset, "\n")
        shell: Rscript {0}

      - name: Check Hugging Face token and dataset
        if: inputs.check_only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf auth whoami
          hf datasets info najkoja/jn_analytics

      # The targets store remembers what was built, so unchanged steps are
      # skipped. GitHub drops caches unused for 7 days, so this mainly helps
      # reruns shortly after a build; a quarterly run usually starts fresh
      - name: Restore pipeline state
        if: ${{ !inputs.check_only }}
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ github.run_id }}
          restore-keys: targets-

      - name: Run pipeline
        if: ${{ !inputs.check_only }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          targets::tar_make()
          print(targets::tar_progress_summary())
        shell: Rscript {0}

      # The Parquet export goes to Hugging Face, not into git
      - name: Commit updated reference data
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ data-raw/openalex_sources.csv data-raw/diagnostics/
          if git diff --cached --quiet; then
            echo "No changes to the reference data."
          else
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
            git push
          fi
